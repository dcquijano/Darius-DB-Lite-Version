name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.1.5; defaults to v<version> from wails.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-publish
  cancel-in-progress: true

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || 'dcquijano/Darius-DB-Lite-Releases' }}

jobs:
  build-windows:
    if: "github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release tag and publishing target
        id: meta
        shell: pwsh
        env:
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}
        run: |
          $tag = ""
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}".Trim() -ne "") {
            $tag = "${{ inputs.release_tag }}".Trim()
          } else {
            $wj = Get-Content "wails.json" -Raw -Encoding UTF8 | ConvertFrom-Json
            $tag = "v" + ([string]$wj.info.productVersion).Trim().TrimStart("v")
          }
          $mode = if ($env:HAS_RELEASES_TOKEN -eq "true") { "external" } else { "self" }
          $target = if ($mode -eq "external") { $env:RELEASES_REPO } else { "${{ github.repository }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag (mode: $mode -> $target)"

      - name: Build Darius DB (GUI, Launcher, Uninstaller, Updater, CLI, Portable ZIP & Setup EXE)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build-all.ps1 -SkipVersionGen

      - name: Generate release notes from version.json and git commits
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/generate-version.ps1 `
            -KeepBuild `
            -OutputPath "release-version.json"

          $vj = Get-Content "release-version.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $bt = [char]96
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## $($vj.name) (Build $($vj.build))")
          $lines.Add("")
          if ($vj.announcement) {
            $lines.Add([string]$vj.announcement)
            $lines.Add("")
          }
          $lines.Add("### What's New")
          $items = @($vj.changelog | Select-Object -First 20)
          foreach ($item in $items) {
            $lines.Add("- $item")
          }
          $lines.Add("")
          $lines.Add("### Included Downloads")
          $lines.Add("- ${bt}DariusDB-Setup-$($vj.version).exe${bt} - All-in-one Windows Installer")
          $lines.Add("- ${bt}DariusDB-$($vj.version)-portable-windows-amd64.zip${bt} - Portable ZIP (GUI, CLI & tools)")
          $lines.Add("- ${bt}DariusDB-Launcher.exe${bt}, ${bt}DariusDB-Repair.exe${bt}, ${bt}DariusDB-Updater.exe${bt}, ${bt}DariusDB-Uninstall.exe${bt}")
          $lines.Add("")
          $sha = if ($env:GITHUB_SHA -and $env:GITHUB_SHA.Length -ge 7) { $env:GITHUB_SHA.Substring(0, 7) } else { [string]$vj.latestCommit }
          $lines.Add("Released: $($vj.releasedAt) | Commit: ${bt}${sha}${bt}")
          [System.IO.File]::WriteAllText((Join-Path $PWD "release-notes.md"), ($lines -join "`n") + "`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DariusDB-windows-amd64
          path: |
            dist/DariusDB-Setup-*.exe
            dist/DariusDB-*-portable-windows-amd64.zip
            installer/DariusDB-Launcher.exe
            installer/DariusDB-Repair.exe
            installer/DariusDB-Uninstall.exe
            installer/DariusDB-Updater.exe

      # Mode 1 (external): Binary-only public releases repo when RELEASES_REPO_TOKEN is configured
      - name: Checkout public binary-only releases repository
        if: steps.meta.outputs.mode == 'external'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: _releases_repo

      - name: Sync public binaries and metadata (no source code) to releases repository
        if: steps.meta.outputs.mode == 'external'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $relDir = Join-Path $PWD "_releases_repo"
          $instDir = Join-Path $relDir "installer"
          New-Item -ItemType Directory -Force -Path $instDir | Out-Null

          # Remove older Setup-*.exe so only the newest installer stays in installer/
          Remove-Item -Force (Join-Path $instDir "DariusDB-Setup-*.exe") -ErrorAction SilentlyContinue

          # Copy ONLY user-facing docs, catalog, and compiled Windows executables (ZERO Go/JS source code)
          Copy-Item -Force "README.md", "GUIDE.md", "LICENSE" $relDir
          Copy-Item -Force "internal\core\catalog.json" (Join-Path $relDir "catalog.json")
          Copy-Item -Force "dist\DariusDB-Setup-*.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Launcher.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Repair.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Uninstall.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Updater.exe" $instDir

          # Generate version.json pointing all release/fallback URLs at RELEASES_REPO
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/generate-version.ps1 `
            -KeepBuild `
            -RepoSlug "$env:RELEASES_REPO" `
            -OutputPath (Join-Path $relDir "version.json")

          Push-Location $relDir
          try {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "release: Darius DB Lite Version ${{ steps.meta.outputs.tag }} (binaries only)"
              git push origin HEAD:main
            } else {
              Write-Host "No changes to push to $env:RELEASES_REPO."
            }
            git tag -f "${{ steps.meta.outputs.tag }}" HEAD
            git push -f origin "refs/tags/${{ steps.meta.outputs.tag }}"
          } finally {
            Pop-Location
          }

      - name: Publish binary-only GitHub Release to public releases repository
        if: steps.meta.outputs.mode == 'external'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: Darius DB (Lite Version ${{ steps.meta.outputs.tag }})
          body_path: release-notes.md
          files: |
            dist/DariusDB-Setup-*.exe
            dist/DariusDB-*-portable-windows-amd64.zip
            installer/DariusDB-Launcher.exe
            installer/DariusDB-Repair.exe
            installer/DariusDB-Uninstall.exe
            installer/DariusDB-Updater.exe

      # Mode 2 (self): Fallback to current repository when RELEASES_REPO_TOKEN is not configured yet
      - name: Update release tag on current repository
        if: steps.meta.outputs.mode == 'self' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          git tag -f "$tag" HEAD
          git push -f origin "refs/tags/$tag"

      - name: Publish GitHub Release to current repository
        if: steps.meta.outputs.mode == 'self'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Darius DB (Lite Version ${{ steps.meta.outputs.tag }})
          body_path: release-notes.md
          files: |
            dist/DariusDB-Setup-*.exe
            dist/DariusDB-*-portable-windows-amd64.zip
            installer/DariusDB-Launcher.exe
            installer/DariusDB-Repair.exe
            installer/DariusDB-Uninstall.exe
            installer/DariusDB-Updater.exe
