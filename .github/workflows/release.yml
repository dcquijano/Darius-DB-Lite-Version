name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build Darius DB (GUI, Launcher, Uninstaller, Portable ZIP & Inno Setup Installer)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build-all.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DariusDB-windows-amd64
          path: |
            dist/*.zip
            dist/*.exe
