name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.1.5; defaults to v<version> from wails.json)"
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || 'dcquijano/Darius-DB-Lite-Releases' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}".Trim() -ne "") {
            $tag = "${{ inputs.release_tag }}".Trim()
          } else {
            $wj = Get-Content "wails.json" -Raw -Encoding UTF8 | ConvertFrom-Json
            $tag = "v" + ([string]$wj.info.productVersion).Trim().TrimStart("v")
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag (target repo: $env:RELEASES_REPO)"

      - name: Build Darius DB (GUI, Launcher, Uninstaller, Updater, CLI, Portable ZIP & Setup EXE)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build-all.ps1 -SkipVersionGen

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DariusDB-windows-amd64
          path: |
            dist/DariusDB-Setup-*.exe
            dist/DariusDB-*-portable-windows-amd64.zip
            installer/DariusDB-Launcher.exe
            installer/DariusDB-Repair.exe
            installer/DariusDB-Uninstall.exe
            installer/DariusDB-Updater.exe

      - name: Verify public releases repository secret
        shell: pwsh
        env:
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}
        run: |
          if ($env:HAS_RELEASES_TOKEN -ne "true") {
            Write-Error @"
Missing repository secret RELEASES_REPO_TOKEN.
To publish binary-only releases (zero source code) while keeping this source repo Private:
  1. Create a Public GitHub repo '$env:RELEASES_REPO' (check 'Add a README file').
  2. Create a Fine-Grained Personal Access Token with 'Contents: Read and write' scoped ONLY to '$env:RELEASES_REPO'.
  3. Add it in this private repo under Settings -> Secrets and variables -> Actions -> New repository secret:
     Name: RELEASES_REPO_TOKEN
"@
            exit 1
          }

      - name: Checkout public binary-only releases repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: _releases_repo

      - name: Sync public binaries and metadata (no source code) to releases repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $relDir = Join-Path $PWD "_releases_repo"
          $instDir = Join-Path $relDir "installer"
          New-Item -ItemType Directory -Force -Path $instDir | Out-Null

          # Remove older Setup-*.exe so only the newest installer stays in installer/
          Remove-Item -Force (Join-Path $instDir "DariusDB-Setup-*.exe") -ErrorAction SilentlyContinue

          # Copy ONLY user-facing docs, catalog, and compiled Windows executables (ZERO Go/JS source code)
          Copy-Item -Force "README.md", "GUIDE.md", "LICENSE" $relDir
          Copy-Item -Force "internal\core\catalog.json" (Join-Path $relDir "catalog.json")
          Copy-Item -Force "dist\DariusDB-Setup-*.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Launcher.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Repair.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Uninstall.exe" $instDir
          Copy-Item -Force "installer\DariusDB-Updater.exe" $instDir

          # Generate version.json pointing all release/fallback URLs at RELEASES_REPO
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/generate-version.ps1 `
            -KeepBuild `
            -RepoSlug "$env:RELEASES_REPO" `
            -OutputPath (Join-Path $relDir "version.json")

          Push-Location $relDir
          try {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "release: Darius DB Lite Version ${{ steps.meta.outputs.tag }} (binaries only)"
              git push origin HEAD:main
            } else {
              Write-Host "No changes to push to $env:RELEASES_REPO."
            }
          } finally {
            Pop-Location
          }

      - name: Publish binary-only GitHub Release to public releases repository
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: Darius DB (Lite Version ${{ steps.meta.outputs.tag }})
          generate_release_notes: true
          files: |
            dist/DariusDB-Setup-*.exe
            dist/DariusDB-*-portable-windows-amd64.zip
            installer/DariusDB-Launcher.exe
            installer/DariusDB-Repair.exe
            installer/DariusDB-Uninstall.exe
            installer/DariusDB-Updater.exe
